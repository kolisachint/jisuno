[package]
name = "jisuno"
description = "Local, offline voice-to-text for the terminal — Parakeet (ONNX)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The macOS menu bar app (GPUI runtime + NSStatusItem alongside).
# Code is also gated on target_os = "macos", so Linux CI builds with the
# feature enabled but compiles the CLI only.
app = [
    "dep:cpal",
    "dep:gpui",
    "dep:gpui-platform",
    "dep:jisuno-platform",
    "dep:jisuno-ui",
]

# Debug hooks: `--debug-wav`, `--debug-hold-ms`, `--debug-open` and the
# `JISUNO_DEBUG_*` env vars. Off in release builds (packaging/bundle.sh does
# not enable it).
dev = ["jisuno-asr/dev"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
jisuno-asr = { workspace = true }
jisuno-audio = { workspace = true }
jisuno-logic = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { workspace = true, optional = true }
gpui = { package = "gpui-pre", version = "=0.3.14", optional = true }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["font-kit"], optional = true }
jisuno-platform = { workspace = true, optional = true }
jisuno-ui = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
