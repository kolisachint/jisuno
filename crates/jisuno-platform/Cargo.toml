[package]
name = "jisuno-platform"
description = "macOS glue for Jisuno: event tap, text insertion, app identity, permissions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
jisuno-logic = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["elcapitan"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = "0.3"
