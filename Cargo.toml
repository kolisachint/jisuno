[package]
name = "voicetools"
version = "0.1.4"
edition = "2021"
description = "Local, offline voice-to-text for the terminal — Parakeet (ONNX)"
license = "MIT"
repository = "https://github.com/kolisachint/voicetools"

[[bin]]
name = "voicetools"
path = "src/main.rs"

[dependencies]
# --- Parakeet backend ---
ort     = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
ndarray = "0.16"

# --- Mic, audio, CLI, downloads ---
cpal   = "0.15"
hound  = "3.5"           # WAV decode for `--wav` and tests
ureq   = { version = "2", features = ["tls", "native-certs", "proxy-from-env"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
rustls-pemfile = "2"
webpki-roots = "0.26"
dirs   = "5"
anyhow = "1"
clap   = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = true
strip = true
