[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kolisachint/jisuno"

[workspace.dependencies]
jisuno-logic = { path = "crates/jisuno-logic", version = "0.1.0" }
jisuno-audio = { path = "crates/jisuno-audio", version = "0.1.0" }
jisuno-asr = { path = "crates/jisuno-asr", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.15"
dirs = "5"
hound = "3.5"
ndarray = "0.16"
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
rustls-pemfile = "2"
ureq = { version = "2", features = ["tls", "native-certs", "proxy-from-env"] }
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = true
strip = true
